defaults:
  - _self_

name: xy_local_paulis_n20
seed: 12345
n: 20
k: 19

qubits:
  values: ["${n}"]
samples:
  powers: {base: 2, start: 7, stop: 21}
repetitions: 10

state:
  class: HRState
  name: HR_state

observables:
  init: random
  count: 50
  sample_indices: [X, Y]
  k_local: ${k}
  padding_indices: [I, Z]

batch:
  states: 1
  observables: 50
  samples: 64

experiments:
  - id: clifford
    shadow_class: CliffordShadow
    shadow_args:
      simulator: statevector
    experiment_name: Clifford
    path_prefix: results/CliffordEx_nmax20_N1048576_reps10_kNone_bsState1_bsObs50_bsN64
    verbose: true

  - id: sgm_uniform
    shadow_class: SGMShadow
    shadow_args:
      simulator: statevector
    experiment_name: SGM uniform
    path_prefix: results/SGMEx1_nmax20_N1048576_reps10_kNone_bsState1_bsObs50_bsN64
    verbose: true

  - id: sgm_binomial
    shadow_class: SGMShadow
    shadow_args:
      simulator: statevector
      distribution: {name: binomial, q: "${eval:'${k}/${n}'}"}
    experiment_name: SGM binomial
    path_prefix: results/SGMEx2_q19of20_nmax20_N1048576_reps10_kNone_bsState1_bsObs50_bsN64
    verbose: true

plot:
  function: plot_avg_var
  path: plots/scaling_batched_n20_Nobs50_reps10.pdf
  x: N
  xlog: true
  ylog: true
  metric: rmse
  aggregation_batch_size: 16
  progress: true
  style:
    font_sizes: {axes: 15, ticks: 15, legend: 14, legend_title: 14}
    marker_size: 8
    line_width: 2
    legend_location: upper right
    aspect_ratio: 1.2


hydra:
  run: {dir: .}
  output_subdir: null
  job: {chdir: false}

defaults:
  - _self_

name: arrhenius_majorana_sample_comp
seed: 12345
nmin: 4
nmax_exclusive: 22
n_step: 2
k: 2
N: 1048576

qubits:
  range:
    start: ${nmin}
    stop: ${nmax_exclusive}
    step: ${n_step}

samples:
  range: 
    start: 4096
    stop: ${eval:'${N}+1'}
    step: 4096
repetitions: 10

state:
  class: MajoranaState
  name: Majorana_state

observables:
  init: majorana_rdm
  order: ${k}
  count: 50

batch:
  states: 1
  observables: 50
  samples: 1024

experiments:
  - id: clifford_majorana
    shadow_class: CliffordShadow
    shadow_args: {simulator: statevector}
    experiment_name: Clifford
    path_prefix: results/CliffordMajorana_rdm_nmax${nmax_exclusive}_Nobs${observables.count}_reps${repetitions}_N${N}_k${k}
    verbose: true
  - id: pauli_majorana
    shadow_class: PauliShadow
    shadow_args: {simulator: statevector}
    experiment_name: Pauli
    path_prefix: results/PauliMajorana_rdm_nmax${nmax_exclusive}_Nobs${observables.count}_reps${repetitions}_N${N}_k${k}
    verbose: true
  - id: fermionic_gaussian
    shadow_class: FermionicGaussianShadow
    shadow_args: {simulator: statevector}
    experiment_name: FGU
    path_prefix: results/FGUMajorana_rdm_nmax${nmax_exclusive}_Nobs${observables.count}_reps${repetitions}_N${N}_k${k}
    verbose: true
  - id: sgm_majorana_binomial_optimized
    shadow_class: SGMShadow
    shadow_args:
      simulator: statevector
      distribution: {name: binomial, q: rdm_optim}
    experiment_name: SGM optimal q
    path_prefix: results/SGMMajoranaBinomOptim_rdm_nmax${nmax_exclusive}_Nobs${observables.count}_reps${repetitions}_N${N}_k${k}
    verbose: true
  - id: sgm_majorana_fixed_weight
    shadow_class: SGMShadow
    shadow_args:
      simulator: statevector
      distribution: {name: fixed_weight, weights: rdm_optim}
    experiment_name: SGM optimal weights
    path_prefix: results/SGMMajoranaFixedWeight_rdm_nmax${nmax_exclusive}_Nobs${observables.count}_reps${repetitions}_N${N}_k${k}
    verbose: true

plot:
  function: plot_sample_complexity
  epsilon: 0.1
  path: plots/Majorana_sample_complexity_eps${plot.epsilon}_nmax${nmax_exclusive}_Nobs${observables.count}_reps${repetitions}_N${N}_k${k}.pdf
  x: n
  xlog: true
  ylog: true
  metric: rmse
  aggregation_batch_size: 16
  progress: true
  style:
    font_sizes: {axes: 15, ticks: 15, legend: 14, legend_title: 14}
    marker_size: 8
    line_width: 2
    legend_location: best
    aspect_ratio: 1.2
    

hydra:
  run: {dir: .}
  output_subdir: null
  job: {chdir: false}

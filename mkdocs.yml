site_name: Classical shadows with SGM
site_description: Simulation and evaluation of classical-shadow protocols.
site_url: https://docs.sgm-shadows.com/
repo_url: https://github.com/marcwannerchalmers/classical_shadows_SGM
repo_name: marcwannerchalmers/classical_shadows_SGM
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - search.highlight

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Configuration: concepts/configuration.md
  - Tutorials:
      - Run an experiment: tutorials/run-experiment.md
  - API reference: reference/api.md
  - Documentation development: development.md
  - Publishing: publishing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            allow_inspection: false
            annotations_path: brief
            docstring_section_style: list
            docstring_style: google
            filters: public
            inherited_members: false
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_full_path: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: true
            show_symbol_type_heading: true
            signature_crossrefs: true
            summary: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

validation:
  invalid_links: true
  invalid_link_anchors: true
